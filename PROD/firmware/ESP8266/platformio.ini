; ============================================================
;  Banc de mesure de force — LoLin NodeMCU v3 (ESP8266)
;  Passerelle WiFi REST (Access Point) entre le backend et l'OpenRB-150.
;  PlatformIO configuration.
; ============================================================
[env:nodemcuv2]
platform  = espressif8266
board     = nodemcuv2
framework = arduino

; Vitesse série monitor (USB debug)
monitor_speed = 115200

; Génère include/secrets.h depuis ../../.machine_config.ini AVANT chaque build.
; (secrets.h = WIFI_SSID / WIFI_PASSWORD / AUTH_TOKEN / HTTP_PORT, gitignoré)
extra_scripts = pre:gen_secrets.py

; Librairies (ESP8266WiFi/ESP8266WebServer/SoftwareSerial = core Arduino).
; Seul ArduinoJson est externe. WebSockets retiré : non utilisé par main.cpp.
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=0
