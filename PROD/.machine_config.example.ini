; =============================================================================
;  .machine_config.ini  —  CONFIGURATION CENTRALE UNIQUE de la machine de test
; =============================================================================
;
;  Ce fichier est l'UNIQUE source de vérité pour tous les paramètres et secrets
;  du projet. Il est lu par les TROIS couches logicielles :
;
;    - Backend Python  : backend/machine_config.py (puis config.py / api.py)
;    - Passerelle ESP8266 : firmware/ESP8266 (script PlatformIO gen_secrets.py
;                           -> génère include/secrets.h au build)
;    - Scripts shell   : run.sh / dev.sh (affichage IP, SSID, mode)
;
;  PROCÉDURE :
;    1. Copier ce fichier en `.machine_config.ini` (sans `.example`).
;    2. Renseigner les vraies valeurs ci-dessous.
;    3. `.machine_config.ini` est gitignoré : les secrets ne partent JAMAIS
;       dans le dépôt. Seul ce `.example` (avec des placeholders) est versionné.
;
;  Après toute modification des sections [wifi] / [nodemcu] / [esp8266], il faut
;  RE-FLASHER l'ESP8266 (les valeurs y sont compilées via secrets.h).
; =============================================================================

[wifi]
; Réseau WiFi que l'ESP8266 DIFFUSE (mode Access Point). Le PC s'y connecte.
ssid = NodeMCU-Control
password = change_me_wifi_password
; Délai (s) max d'attente d'une connexion WiFi côté outils.
timeout = 10

[nodemcu]
; Adresse de l'ESP8266 vue depuis le PC une fois connecté à son réseau AP.
; En mode AP l'ESP est TOUJOURS la passerelle 192.168.4.1.
ip = 192.168.4.1
port = 8080
protocol = http
; Jeton Bearer partagé : doit être IDENTIQUE ici et dans le firmware ESP8266.
key = change_me_bearer_token
; Timeout (s) des requêtes HTTP backend -> ESP (court : un brownout ne doit pas
; bloquer un thread FastAPI).
timeout = 2

[serial]
; Mode USB direct (DEV) : le backend parle à l'OpenRB/ESP par port série au lieu
; du WiFi. `port = auto` => détection automatique au lancement.
port = auto
baudrate = 115200
timeout = 1

[esp8266]
; Port du serveur HTTP exposé par l'ESP8266 (doit matcher [nodemcu].port).
http_port = 8080

[logging]
; Niveau de log par défaut : ERROR | WARNING | INFO | DEBUG | TRACE
level = INFO

[calibration]
; Résistance de gain (OHM) de l'INA125 pour les cellules de force.
; Détermine le dossier utilisé : PROD/cal/XXX/cell*.cal
; Valeurs courantes : 330, 470, 1000, ...
resistance = 330
